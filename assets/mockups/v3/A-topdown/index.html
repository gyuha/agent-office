<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hearthside Office — top-down RPG</title><style>html,body{margin:0;background:#eee1c4}canvas{display:block;width:100%;height:auto;image-rendering:pixelated}</style></head><body><canvas id="office" width="1600" height="1000" aria-label="Three separate animated top-down pixel art offices. Alpha has an orchestrator and six agents, Beta has an orchestrator and two agents, and Solo has one agent."></canvas><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const files=['floor','wall','window','plant','door','coffee','rug','bookshelf','manager-desk','desk-0','desk-1','desk-2','working-0','working-1','working-2','working-3','away-0','phone-0','phone-1','sleeping-0','sleeping-1'];
const sprites=Object.fromEntries(files.map(name=>{const image=new Image();image.src='sprites/'+name+'.png';return [name,image]}));
function image(name,x,y,scale=2){const i=sprites[name];if(i.complete&&i.naturalWidth)ctx.drawImage(i,Math.round(x),Math.round(y),i.naturalWidth*scale,i.naturalHeight*scale)}
function box(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}
function text(s,x,y,size=15,color='#5a4031',align='left'){ctx.fillStyle=color;ctx.font=`bold ${size}px monospace`;ctx.textAlign=align;ctx.fillText(s,x,y)}
// The room's dimensions are derived from the number of stations and rows.
function room(x,y,columns,states,name,time,solo=false){const rows=Math.ceil(states.length/columns),cellW=160,cellH=164,w=columns*cellW+48,h=(solo?1:rows)*cellH+(solo?190:320);box(x+8,y+8,w,h,'#aa8b69');box(x,y,w,h,'#754d38');for(let yy=y+40;yy<y+h-8;yy+=32)for(let xx=x+8;xx<x+w-8;xx+=32)image('floor',xx,yy);for(let xx=x+8;xx<x+w-8;xx+=32)image('wall',xx,y+8);image('window',x+16,y+4);image('window',x+w-80,y+4);image('plant',x+4,y+h-72);image('door',x+w-68,solo?y+h-72:y+235);image('coffee',x+w-68,y+65);text(name,x,y-18,18);text(solo?'INDEPENDENT':'GROUP OFFICE',x+w,solo?y-3:y-18,11,'#947356','right');
 if(!solo){let cx=x+w/2; // An enclosed manager nook with a woven rug, books and a larger desk.
  box(cx-105,y+52,210,137,'#8c6047');box(cx-101,y+56,202,129,'#e6c9a2');for(let n=0;n<3;n++)image('rug',cx-96+n*64,y+104);image('bookshelf',cx-99,y+62);image('plant',cx+40,y+61);station(cx,y+170,'working',0,time,true);}
 states.forEach((state,i)=>{let cx=x+24+cellW/2+(i%columns)*cellW,cy=y+(solo?170:390)+Math.floor(i/columns)*cellH;station(cx,cy,state,(i+1)%3,time,false)});}
let labels=[];
function station(cx,cy,state,provider,time,manager){const frame=state==='working'?Math.floor(time/140)%4:state==='away'?0:Math.floor(time/550)%2;image(state+'-'+frame,cx-64,cy-116);image(manager?'manager-desk':'desk-'+provider,cx-(manager?88:64),cy-29);labels.push([manager?'ORCHESTRATOR • '+state.toUpperCase():state.toUpperCase(),cx,cy+(manager?96:77),manager?13:11])}
function draw(time){labels=[];box(0,0,1600,1000,'#eee1c4');text('HEARTHSIDE OFFICE',48,58,31);text('A / TOP-DOWN RPG    •    EACH GROUP HAS ITS OWN ROOM',50,86,14,'#98795c');room(48,144,3,['working','away','phone','sleeping','working','phone'],'ALPHA  /  7 AGENTS',time);room(655,144,2,['away','sleeping'],'BETA  /  3 AGENTS',time);room(1135,144,1,['phone'],'SOLO  /  1 AGENT',time,true);for(const [s,x,y,n] of labels)text(s,x,y,n,'#4b3024','center');box(655,705,770,140,'#f8edd6');text('THE WORKDAY, AT A GLANCE',680,740,16);text('WORKING  /  AWAY  /  PHONE  /  SLEEPING',680,772,14);text('✚  CLAUDE      ▣  CODEX      ✦  ANTIGRAVITY',680,810,14,'#9a6b51');text('PIXEL SPRITES  •  ANIMATED IN THE BROWSER',48,925,13,'#98795c');requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></body></html>
