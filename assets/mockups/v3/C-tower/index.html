<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Office Tower — side elevation</title><style>html,body{margin:0;background:#cfe1df}canvas{display:block;width:100%;height:auto;image-rendering:pixelated}</style></head><body><canvas id="tower" width="1600" height="1000" aria-label="Three separate pixel-art office buildings showing a manager, working, away, phone and sleeping agents"></canvas><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const files=['wall','window','door','plant','coffee','lamp','elevator','manager-desk','desk-0','desk-1','desk-2','working-0','working-1','working-2','working-3','away-0','phone-0','phone-1','sleeping-0','sleeping-1'];const art=Object.fromEntries(files.map(n=>{const img=new Image;img.src='sprites/'+n+'.png';return [n,img]}));
function img(n,x,y,s=2){const a=art[n];if(a.complete&&a.naturalWidth)ctx.drawImage(a,Math.round(x),Math.round(y),a.naturalWidth*s,a.naturalHeight*s)}function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}function label(s,x,y,n=13,color='#51453f',align='left'){ctx.font=`bold ${n}px monospace`;ctx.fillStyle=color;ctx.textAlign=align;ctx.fillText(s,x,y)}
let captions=[];
// Width follows the number of desks per floor; height follows the number of occupied floors.
function building(x,base,count,name,states,t,solo=false){let cols=solo?1:Math.min(3,states.length),floors=solo?1:1+Math.ceil(states.length/3),w=cols*170+80,h=floors*190,top=base-h;rect(x+8,top+8,w,h,'#927568');rect(x-6,top-10,w+12,h+10,'#76584a');rect(x,top,w,h,'#e9dac5');label(name,x+w/2,top-29,17,'#51453f','center');label(solo?'INDEPENDENT':'GROUP BUILDING',x+w/2,top-12,10,'#725e53','center');
 for(let f=0;f<floors;f++){let y=top+f*190;for(let yy=y+4;yy<y+170;yy+=48)for(let xx=x+4;xx<x+w-35;xx+=48)img('wall',xx,yy);img('window',x+15,y+20);if(f===0&&!solo){img('window',x+w-115,y+20);rect(x+w/2-105,y+30,210,130,'#dcc3a5')}else{img('plant',x+w-65,y+100);if(w>300)img('coffee',x+3,y+104)}rect(x,y+178,w,12,'#785a4a');if(f>0&&!solo)img('elevator',x+w-67,y+80);}
 img('door',solo?x+5:x+w-58,base-76);if(solo){station(x+60,base,'phone',2,t,false);return}
 station(x+w/2-(cols===2?62:32),top+190,'working',0,t,true);
 states.forEach((s,i)=>{let floor=Math.floor(i/3)+1,at=i%3;station(x+32+at*170,top+(floor+1)*190,s,(i+1)%3,t,false)})}
function station(x,floorBottom,state,k,t,manager){let f=state==='working'?Math.floor(t/140)%4:state==='away'?0:Math.floor(t/550)%2;img(state+'-'+f,x,floorBottom-186);img(manager?'manager-desk':'desk-'+k,x+65,floorBottom-160);captions.push([manager?'ORCHESTRATOR / WORKING':state.toUpperCase(),x+(manager?163:135),floorBottom-5])}
function draw(t){captions=[];rect(0,0,1600,1000,'#cfe1df');rect(0,790,1600,210,'#c2b499');rect(0,835,1600,165,'#a6b18f');label('OFFICE TOWER',50,60,32);label('C / SIDE ELEVATION  •  A SEPARATE BUILDING FOR EACH GROUP',52,88,14,'#758e87');img('lamp',635,650);img('lamp',1165,650);building(45,800,6,'ALPHA  /  7 AGENTS',['working','away','phone','sleeping','working','phone'],t);building(735,800,2,'BETA  /  3 AGENTS',['away','sleeping'],t);building(1265,800,1,'SOLO  /  1 AGENT',['phone'],t,true);for(const [s,x,y] of captions){ctx.font='bold 11px monospace';const w=Math.ceil(ctx.measureText(s).width)+10;rect(x-w/2,y-11,w,15,'#f3e7d4');label(s,x,y,11,'#40352f','center')}rect(45,900,1000,66,'#f1e8d6');label('✚ CLAUDE     ▣ CODEX     ✦ ANTIGRAVITY',65,927,14);label('WORKING  /  AWAY  /  PHONE  /  SLEEPING',65,950,13);requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></body></html>
