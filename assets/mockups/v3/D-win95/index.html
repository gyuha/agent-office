<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Office 95</title><style>html,body{margin:0;background:#008080}canvas{display:block;width:100%;height:auto;image-rendering:pixelated}</style></head><body><canvas id="screen" width="1600" height="1000" aria-label="Three separate animated Win95 office windows with agents and live status counts"></canvas><script>
const c=document.querySelector('canvas'),g=c.getContext('2d');g.imageSmoothingEnabled=false;
const paths=['desk-0','desk-1','desk-2','manager-desk','working-0','working-1','working-2','working-3','away-0','phone-0','phone-1','sleeping-0','sleeping-1','window','plant','coffee','floor'];const sprites=Object.fromEntries(paths.map(n=>{let a=new Image;a.src='sprites/'+n+'.png';return [n,a]}));
function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}function image(n,x,y,s=2){let a=sprites[n];if(a.complete&&a.naturalWidth)g.drawImage(a,Math.round(x),Math.round(y),a.naturalWidth*s,a.naturalHeight*s)}function text(s,x,y,size=14,color='#252525',align='left'){g.font=`bold ${size}px monospace`;g.fillStyle=color;g.textAlign=align;g.fillText(s,x,y)}
function bevel(x,y,w,h,down=false){rect(x,y,w,h,'#c0c0c0');rect(x,y,w,2,down?'#808080':'#fff');rect(x,y,2,h,down?'#808080':'#fff');rect(x,y+h-2,w,2,down?'#fff':'#404040');rect(x+w-2,y,2,h,down?'#fff':'#404040')}
let labels=[];
function station(x,y,state,k,t,manager=false){let f=state==='working'?Math.floor(t/140)%4:state==='away'?0:Math.floor(t/550)%2;image(state+'-'+f,x-36,y-72,1);image(manager?'manager-desk':'desk-'+k,x-(manager?46:36),y-18,1);labels.push([manager?'ORCHESTRATOR / WORKING':state.toUpperCase(),x,y+(manager?58:50)])}
function office(x,y,columns,states,name,t,solo=false){let w=solo?240:columns*220+80,h=solo?350:states.length>3?790:620;bevel(x,y,w,h);rect(x+5,y+5,w-10,27,'#000080');rect(x+10,y+10,16,16,'#00a4a4');text('▣',x+11,y+23,13,'white');text(name+' - Office',x+32,y+24,14,'white');for(let i=0;i<3;i++){let bx=x+w-66+i*20;bevel(bx,y+8,18,18);text(['_','□','×'][i],bx+9,y+21,13,'#111','center')}text('File    Edit    View    Help',x+12,y+54,13);rect(x+6,y+64,w-12,h-95,'#dcd6c8');
 // A shallow frontal room: vertical back wall and receding floor.
 rect(x+10,y+68,w-20,62,'#bec5bc');rect(x+10,y+126,w-20,7,'#8c928a');for(let yy=y+133;yy<y+h-39;yy+=32)for(let xx=x+10;xx<x+w-30;xx+=32)image('floor',xx,yy);image('window',x+15,y+66);if(w>300)image('window',x+w-82,y+66);image('plant',x+10,y+h-112);if(w>300)image('coffee',x+w-75,y+145);
 if(solo){station(x+w/2,y+192,'phone',2,t)}else{rect(x+w/2-112,y+139,224,130,'#a5aaa1');image('plant',x+w/2+47,y+150);station(x+w/2,y+200,'working',0,t,true);states.forEach((s,i)=>{let cx=x+40+110+(i%columns)*220,cy=y+360+Math.floor(i/columns)*150;station(cx,cy,s,(i+1)%3,t)})}
 // Status bar is deliberately below the last station label.
 bevel(x+5,y+h-27,w-10,22,true);let all=solo?states:['working',...states],working=all.filter(s=>s==='working').length;text(all.length+' agents · '+working+' working',x+14,y+h-11,12,'#303030');}
function draw(t){labels=[];rect(0,0,1600,1000,'#008080');text('OFFICE 95',45,48,27,'#fff');text('D / THREE-QUARTER FRONT VIEW',46,73,13,'#c4e1d9');office(40,95,3,['working','away','phone','sleeping','working','phone'],'ALPHA',t);office(800,95,2,['away','sleeping'],'BETA',t);office(1335,500,1,['phone'],'SOLO',t,true);for(const [s,x,y] of labels){g.font='bold 11px monospace';let w=g.measureText(s).width+8;rect(x-w/2,y-11,w,14,'#e4e0d5');text(s,x,y,11,'#292929','center')}
 // Taskbar and Start button.
 bevel(0,950,1600,50);bevel(8,957,108,35);text('▦  Start',23,980,16);bevel(130,957,188,35,true);text('▣  ALPHA',143,980,13);bevel(326,957,188,35);text('▣  BETA',339,980,13);bevel(522,957,188,35);text('▣  SOLO',535,980,13);bevel(1460,957,130,35,true);text('09:41 AM',1525,980,13,'#252525','center');requestAnimationFrame(draw)}requestAnimationFrame(draw)
</script></body></html>
