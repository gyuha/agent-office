<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Office v9 · Modular studio</title><style>*{box-sizing:border-box}body{margin:0;background:#252e38;color:#f6e8cc;font:14px system-ui,sans-serif}header{padding:20px 24px 14px;max-width:1560px;margin:auto}h1{margin:0;font-size:25px}header p{color:#bed0c2;margin:8px 0 15px;line-height:1.6}button,select{font:inherit;color:#f6e8cc;background:#354653;border:1px solid #7e998e;border-radius:3px;padding:7px 11px;cursor:pointer}button[aria-pressed=true]{background:#a66b49;color:#fff}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #f6c971;outline-offset:3px}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.agent-controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.agent-controls label{display:flex;align-items:center;gap:5px;padding:4px 6px;background:#303e49;font-size:12px}.agent-controls select{padding:3px;font-size:12px}.viewport{max-width:1536px;width:calc(100% - 32px);margin:0 auto 24px;overflow:auto;background:#1e2931;border:1px solid #657c75;scrollbar-color:#a7c195 #283643}.world{width:max-content;margin:auto}canvas{display:block;image-rendering:pixelated}#hudtop,#hudbottom{width:100%;max-width:1536px;margin:auto;image-rendering:pixelated;background:#283540;height:64px}#hudbottom{height:64px}footer{max-width:1536px;margin:18px auto;padding:0 20px 20px;color:#bbc8bd;font-size:13px}a{color:#f4ca80}.legend{margin-left:auto;color:#c8d8ca;font-size:12px}@media(max-width:900px){header{padding:16px}.legend{width:100%;margin:0}.viewport{width:calc(100% - 16px)}.agent-controls{max-height:160px;overflow:auto}}@media(prefers-reduced-motion:reduce){.motion-note{display:block}}</style>
<header><h1>함께 일하는 개발실</h1><p>한 방, 하나의 격자. 뒤쪽 중앙의 관리자와 같은 공간에서 작업합니다. 픽셀 배율은 항상 2배입니다. 좁은 화면에서는 방을 가로·세로로 스크롤할 수 있습니다.</p><div class="toolbar"><span>에이전트</span><button data-n="3">3명</button><button data-n="6" aria-pressed="true">6명</button><button data-n="10">10명</button><button data-n="16">16명</button><label>직접 입력 <select id="count" aria-label="에이전트 수"></select></label><button id="allwork">모두 작업</button><button id="reset">자동 데모</button><span class="legend">민트 claude / 블루 codex / 자두 gemini · 골드 orchestrator</span></div><div id="agents" class="agent-controls" aria-label="개별 에이전트 상태"></div></header>
<canvas id="hudtop" aria-label="날짜 시간 및 활동 인원"></canvas><div class="viewport" tabindex="0" aria-label="픽셀 사무실, 방향키 또는 스크롤로 이동"><div class="world"><canvas id="room" aria-label="모듈형 단일 사무실 애니메이션"></canvas></div></div><canvas id="hudbottom" aria-label="완료 작업 토큰 사용량 테스트 통과율"></canvas><footer>상태를 직접 바꾸거나 자동 데모를 관찰하세요. 작업자는 통로로 걸어가 관리자·화이트보드를 방문합니다. phone 상태가 12초 이상 이어지면 책상에서 잠듭니다. HUD 수치는 목업입니다. <a href="layout.json">layout.json</a> · <a href="README.md">자산 규격 및 배치 규칙</a></footer>
