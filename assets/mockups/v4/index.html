<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Office — LPC study</title><style>html,body{margin:0;background:#111927}canvas{display:block;width:100%;height:auto;image-rendering:pixelated}</style></head><body><canvas id="scene" width="1920" height="1080" aria-label="Three animated LPC offices. Alpha has a manager and six agents, Beta has a manager and two agents, and Solo has one agent."></canvas><script>
const SCENE={"alpha":{"x":12,"y":57,"w":474,"h":405,"stations":[[70,332],[178,332],[286,332],[70,427],[178,427],[286,427]]},"beta":{"x":505,"y":57,"w":250,"h":292,"stations":[[561,298],[667,298]]},"solo":{"x":776,"y":57,"w":170,"h":223,"stations":[[861,212]]},"managers":[[390,137],[668,137]]};
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.scale(2,2);
const asset={};function load(key,url){const i=new Image;i.src=url;asset[key]=i}for(let i=0;i<8;i++)for(const a of ['sit','walk','idle'])load(`a${i}-${a}`,`sprites/agent-${i}-${a}.png`);for(const a of ['monitor-0','monitor-1','monitor-2','chair','city-window','plant','sofa','whiteboard','glass-table'])load(a,`sprites/${a}.png`);
const root='../../vendor/';load('furniture',root+'lpc-furniture/dark-wood_3.png');load('shelves',root+'lpc-shelves/bookshelf-brown_0.png');load('floor',root+'lpc-floors/lpc-floors/floors.png');load('coffee',root+'lpc-office/Coffee Maker.png');load('copier',root+'lpc-office/Copy Machine.png');load('water',root+'lpc-office/Water Cooler.png');load('tv',root+'lpc-office/TV, Widescreen.png');load('bin',root+'lpc-office/Bins.png');
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}function txt(s,x,y,n=7,c='#e7e0cf',align='left'){ctx.fillStyle=c;ctx.font=`bold ${n}px monospace`;ctx.textAlign=align;ctx.fillText(s,x,y)}function img(n,x,y,w,h){const a=asset[n];if(a?.complete&&a.naturalWidth)ctx.drawImage(a,Math.round(x),Math.round(y),w??a.width,h??a.height)}function crop(n,sx,sy,sw,sh,x,y,w=sw,h=sh){const a=asset[n];if(a?.complete&&a.naturalWidth)ctx.drawImage(a,sx,sy,sw,sh,Math.round(x),Math.round(y),w,h)}
function plankFloor(x,y,w,h){ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();for(let yy=0;yy<h;yy+=32)for(let xx=0;xx<w;xx+=32)crop('floor',192,1216,32,32,x+xx,y+yy);ctx.restore()}
function room(x,y,w,h,title){rect(x+3,y+3,w,h,'#070d19');rect(x,y,w,h,'#314457');rect(x+4,y+4,w-8,h-8,'#d7d3bd');plankFloor(x+5,y+61,w-10,h-66);rect(x+5,y+4,w-10,57,'#d9ddce');rect(x+5,y+54,w-10,7,'#666f68');txt(title,x,y-7,9,'#e7e4d7');}
function desk(x,y,k,manager=false){ // Vendor wood furniture crop, with custom monitor, keyboard and drawer details.
 crop('furniture',0,304,96,32,x,y,manager?96:80,32);let w=manager?96:80;rect(x+2,y+27,w-4,7,'#795039');rect(x+4,y+34,10,8,'#69432f');rect(x+w-14,y+34,10,8,'#69432f');rect(x+5,y+29,8,5,'#a8724c');rect(x+w-13,y+29,8,5,'#a8724c');img('monitor-'+k,x+w/2+5,y-17);rect(x+w/2-12,y+13,24,6,'#b5b2a2');for(let j=0;j<5;j++)rect(x+w/2-10+j*4,y+14,2,2,'#64706d');}
function agent(id,state,x,y,t,name,targetX,targetY,late=false){if(state==='away'&&!late){img('chair',x-16,y+2);walkers.push(()=>agent(id,state,x,y,t,name,targetX,targetY,true));return}let px=x,py=y,dir=2,act='sit',frame=Math.floor(t/160)%3;const turn=(t%12000)/12000;if(state==='away'){act='walk';const points=[[x,y],[x-30,y],[x-30,y+42],[targetX,y+42],[targetX,targetY]];const progress=turn<1/3?turn*3:turn<.625?1:(1-turn)/.375;let z=progress*(points.length-1),i=Math.min(points.length-2,Math.floor(z)),f=z-i;px=points[i][0]+(points[i+1][0]-points[i][0])*f;py=points[i][1]+(points[i+1][1]-points[i][1])*f;let dx=points[i+1][0]-points[i][0],dy=points[i+1][1]-points[i][1];dir=Math.abs(dx)>Math.abs(dy)?(dx>0?3:1):(dy>0?2:0);if(turn>=1/3&&turn<.625){act='idle';dir=2;frame=Math.floor(t/500)%2}else frame=Math.floor(t/120)%9;}else img('chair',x-16,y+2);
 if(state==='working')px+=(Math.floor(t/85)%2?1:-1);const sheet=asset[`a${id}-${act}`];if(sheet?.complete&&sheet.naturalWidth){let count=sheet.naturalWidth/64;frame%=count;let sx=frame*64,sy=dir*64;let shift=state==='phone'?1:0;if(state==='sleeping'){crop(`a${id}-${act}`,sx+16,sy+28,32,24,px-16,py-7);crop(`a${id}-${act}`,sx+18,sy+13,28,16,px-14,py+6,28,12)}else crop(`a${id}-${act}`,sx,sy,64,64,px-32,py-38+shift);}
 effects.push(()=>{if(state==='working'){let d=Math.floor(t/85)%3;for(let j=0;j<3;j++){rect(px-20-j*2,py-10-j*3+d,10,2,'#edc6a6');rect(px+10+j*2,py-10-j*3-d,10,2,'#edc6a6')}rect(px+12,py-30,3,5,'#61c8d5');for(let j=0;j<4;j++){let rise=(Math.floor(t/150)+j*4)%16;rect(px-12+j*7,py-35-rise,4,3,'#e8ded1')}let jump=(Math.floor(t/110)%14);rect(px+19,py+6-jump,10,7,'#f7edd5');rect(px+21,py+8-jump,6,1,'#ad9a85');if(t%2100<600)txt('!!',px-20,py-35,10,'#ffe184')}
 if(state==='phone'){rect(px-13,py-15,7,10,'#253b49');rect(px-12,py-14,5,7,'#7be2e8');rect(px-9,py-19,7,3,'#8ddbdc');rect(px-10,py-5,5,3,'#e9bd9a');if(t%4500<1200)txt('♥',px+15,py-32,8,'#edc6a6')}
 if(state==='sleeping'){rect(px-14,py+12,12,3,'#d8a281');rect(px+2,py+12,12,3,'#d8a281');txt('Zzz',px+25,py-29-(Math.floor(t/300)%6),11,'#fff4dc')}
 });labels.push([name,px,name==='ORCHESTRATOR'?py+55:py-31])}
let labels=[],effects=[],walkers=[];function station(id,state,x,y,t,name,k,tx,ty){agent(id,state,x,y-55,t,name,tx,ty);desk(x-40,y-38,k)}
function glass(x,y,w,h){rect(x,y,w,2,'#68898d');rect(x,y,2,h,'#68898d');rect(x+w-2,y,2,h,'#68898d');ctx.fillStyle='rgba(171,215,220,.25)';ctx.fillRect(x+2,y+2,w-4,h-4);rect(x,y+h-2,w,2,'#68898d');rect(x+Math.floor(w/2),y,2,h,'#92b8b7')}
const started=Date.now();function draw(){let t=Date.now()-started;labels=[];effects=[];walkers=[];rect(0,0,960,540,'#111927');txt('AGENT OFFICE',14,21,14,'#dbe9e5');txt('LPC PIXEL STUDY   /   LIVE WORKSPACES',14,34,7,'#91aaa9');

 let ax=12,ay=57;room(ax,ay,474,405,'ALPHA   /   7 AGENTS');img('city-window',ax+12,ay+6);img('whiteboard',ax+112,ay+13);crop('shelves',0,0,64,96,ax+188,ay+2,42,63);crop('tv',0,0,96,64,ax+235,ay+9,48,32);rect(ax+206,ay+62,109,55,'#d7dfd4');crop('coffee',0,0,32,32,ax+208,ay+65);crop('water',0,0,32,64,ax+235,ay+60,16,32);crop('copier',0,0,64,64,ax+255,ay+64,32,32);crop('bin',0,0,32,32,ax+290,ay+72,16,16);img('plant',ax+438,ay+26);
 rect(ax+179,ay+14,14,14,'#667776');rect(ax+181,ay+16,10,10,'#e9e9d9');rect(ax+185,ay+18,1,4,'#465758');rect(ax+185,ay+21,3,1,'#465758');rect(ax+451,ay+164,3,23,'#5e4436');rect(ax+447,ay+166,11,2,'#5e4436');rect(ax+447,ay+185,11,2,'#5e4436');
 // Manager in the back, with wider desk, protected by a glass partition.
